services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent_relay
      POSTGRES_PASSWORD: agent_relay
      POSTGRES_DB: agent_relay
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_relay -d agent_relay"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8010:8000"
    environment:
      RELAY_DATABASE_URL: postgresql+psycopg://agent_relay:agent_relay@postgres:5432/agent_relay
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
