apiVersion: v1
kind: Secret
metadata:
  name: agent-relay-db
type: Opaque
stringData:
  POSTGRES_USER: agent_relay
  POSTGRES_PASSWORD: agent_relay
  POSTGRES_DB: agent_relay
  # "postgres" here is the Service name defined in postgres.yaml -- Kubernetes'
  # in-cluster DNS resolves it within this namespace, same role "postgres"
  # played as the Compose service hostname in Question 4. Not localhost.
  RELAY_DATABASE_URL: postgresql+psycopg://agent_relay:agent_relay@postgres:5432/agent_relay
