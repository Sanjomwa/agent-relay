apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # storageClassName intentionally omitted: kind ships a default StorageClass
  # (local-path-provisioner) out of the box, so this binds dynamically.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  # A single ReadWriteOnce PVC can only be mounted by one pod at a time.
  # Recreate (kill old pod before starting new) avoids two pods racing for
  # that PVC during a rollout; the default RollingUpdate strategy would try
  # to start the replacement before the old pod releases the volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: agent-relay-db
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              # PGDATA defaults to /var/lib/postgresql/data, but Postgres
              # refuses to initdb into a non-empty mount point that also
              # contains lost+found (common on freshly provisioned volumes),
              # so point PGDATA at a subdirectory of the mount instead.
              subPath: pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $(POSTGRES_USER) -d $(POSTGRES_DB)"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $(POSTGRES_USER) -d $(POSTGRES_DB)"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  # This name is the DNS hostname the app uses to reach Postgres in-cluster
  # (e.g. "postgres:5432"), the same role the Compose service name played.
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
