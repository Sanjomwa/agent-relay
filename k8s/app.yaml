apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-relay-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-relay-app
  template:
    metadata:
      labels:
        app: agent-relay-app
    spec:
      containers:
        - name: app
          image: agent-relay:local
          # Loaded directly into the kind node via `kind load docker-image`,
          # not pulled from any registry -- Never makes that explicit instead
          # of silently trying (and failing) an external pull.
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: agent-relay-db
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: agent-relay-app
spec:
  selector:
    app: agent-relay-app
  ports:
    - port: 8000
      targetPort: 8000
