[project]
name = "agent-relay"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b0",
    "opentelemetry-sdk>=1.45.0",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
# Collect only the real suites. security-audit/runs/** can hold snapshots with
# copies of the test files, and incident folders hold captured source; neither
# may ever be collected by a plain `uv run pytest -q`.
testpaths = ["test_agent_relay.py", "test_observability.py", "incident-response/tests"]
norecursedirs = [
    ".*", "__pycache__", "*.egg-info", "build", "dist", "node_modules",
    "security-audit", "incident-response/incidents", "deploy", "docs", "k8s", "observability", "scripts",
]
